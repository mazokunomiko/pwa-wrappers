<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dustin Brett Launcher</title>
    
    <!-- PWA Icon Assets -->
    <link rel="icon" type="image/png" sizes="48x48" href="justinbrett.png">
    <link rel="apple-touch-icon" sizes="48x48" href="justinbrett.png">
    <link rel="manifest" href="justinbrett.json">

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .loading-text {
            font-size: 24px;
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="loading-text">Opening Dustin Brett...</div>
    <script>
        // Gives Chrome 6 full seconds to read the manifest and cache the icon file
        setTimeout(function() {
            window.location.replace("https://dustinbrett.com");
        }, 6000);
    </script>
</body>
</html>
